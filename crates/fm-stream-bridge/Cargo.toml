[package]
name = "fm-stream-bridge"
description = "Rust port of bin/fm-stream-bridge.py: serves the Bridge UI's live feed from the stream hub. Drop-in replacement with the same CLI surface."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fm-stream-bridge"
path = "src/main.rs"

[dependencies]
fm-stream-wire.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
